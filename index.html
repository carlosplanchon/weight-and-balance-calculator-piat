                                    assert.equal(b.selectedPlaneId, 'custom');
                                    assert.equal(b.aircraft.weight, 315.5, 'Custom empty weight kept (not wiped by loadPlaneData)');
                                    assert.equal(b.aircraft.arm, 258, 'Custom arm kept');
                                });
                            });
                        });

                        QUnit.test('Corrupt or invalid payloads are ignored', function(assert) {
                            localStorage.setItem(KEY, 'not json');
                            const c = persistent(wbCalculator());
                            return c.init().then(() => {
                                assert.equal(c.selectedPlaneId, '', 'Corrupt JSON leaves defaults');
                                assert.strictEqual(c.savedAt, null);

                                localStorage.setItem(KEY, JSON.stringify({
                                    v: 1, savedAt: Date.now(),
                                    state: { selectedPlaneId: 'CX-NOPE', load: { pilot: 80, copilot: 0, baggage: 0 }, units: 'nautical' }
                                }));
                                const d = persistent(wbCalculator());
                                return d.init().then(() => {
                                    assert.equal(d.selectedPlaneId, '', 'Unknown registration skipped');
                                    assert.equal(d.load.pilot, 80, 'Valid load applied');
                                    assert.equal(d.units, 'metric', 'Unknown units skipped');
                                });
                            });
                        });

                        QUnit.test('reset() clears storage and data but keeps preferences', function(assert) {
                            const c = persistent(wbCalculator());
                            return c.init().then(() => {
                                c.selectedPlaneId = 'alpha_trainer';
                                c.loadPlaneData();
                                c.load.pilot = 90;
                                c.lang = 'en';
                                c.update();
                                assert.ok(localStorage.getItem(KEY));

                                c.reset();
                                assert.strictEqual(localStorage.getItem(KEY), null, 'Storage cleared and not re-saved by the reset update()');
                                assert.equal(c.selectedPlaneId, '', 'Back to the registration prompt');
                                assert.strictEqual(c.load.pilot, null, 'Pilot empty again');
                                assert.strictEqual(c.savedAt, null, 'Age clock hidden');
                                assert.equal(c.lang, 'en', 'Language preference kept');
                            });
                        });

                        QUnit.test('Language and units changes persist without refreshing the age clock', function(assert) {
                            const c = persistent(wbCalculator());
                            return c.init().then(() => {
                            c.load.pilot = 80;
                            c.update();
                            c.savedAt = 12345;

                            c.setLang('en');
                            let stored = JSON.parse(localStorage.getItem(KEY));
                            assert.strictEqual(stored.savedAt, 12345, 'setLang keeps the clock');
                            assert.equal(stored.state.lang, 'en', 'Language persisted');

                            c.setUnits('imperial');
                            stored = JSON.parse(localStorage.getItem(KEY));
                            assert.strictEqual(stored.savedAt, 12345, 'setUnits keeps the clock');
                            assert.equal(stored.state.units, 'imperial', 'Units persisted');

                            c.load.pilot = 190;
                            c.update();
                            stored = JSON.parse(localStorage.getItem(KEY));
                            assert.notEqual(stored.savedAt, 12345, 'A data edit does refresh the clock');
                            });
                        });

                        QUnit.test('A saved registration is dropped if the fleet cannot be read', function(assert) {
                            // The ordering that matters now that the fleet arrives over the
                            // network: the session names an aircraft, the file is unreachable.
                            // The registration must not come back as a label with no data
                            // behind it. Note this one does NOT stub loadFleet: the failing
                            // fetch is the point.
                            localStorage.setItem(KEY, JSON.stringify({
                                v: 1, savedAt: Date.now(),
                                state: { selectedPlaneId: 'CX-GHOST', load: { pilot: 80, copilot: 0, baggage: 0 },
                                         fuel: { startAmount: 30, flightTime: 1 } }
                            }));
                            const c = wbCalculator();
                            c.$watch = function() {};
                            c.FLEET_URL = 'datasets/does-not-exist.json';
                            return c.init().then(() => {
                                assert.equal(c.fleetStatus, 'error', 'Fleet failed to load');
                                assert.equal(c.selectedPlaneId, '', 'The saved registration was not restored');
                                assert.false(c.planeSelected, 'So the results stay behind the registration prompt');
                                assert.equal(c.load.pilot, 80, 'The rest of the session still came back');
                                assert.equal(c.fuel.startAmount, 30, 'Including the fuel');
                            });
                        });

                        QUnit.test('formatAge labels', function(assert) {
                            const c = wbCalculator();
                            assert.equal(c.formatAge(30 * 1000), 'Ingresaste datos recién');
                            assert.equal(c.formatAge(5 * 60 * 1000), 'Ingresaste datos por última vez hace 5 min');
                            assert.equal(c.formatAge(3 * 3600 * 1000), 'Ingresaste datos por última vez hace 3 h');
                            assert.equal(c.formatAge(24 * 3600 * 1000), 'Ingresaste datos por última vez hace 1 día');
                            assert.equal(c.formatAge(2 * 24 * 3600 * 1000), 'Ingresaste datos por última vez hace 2 días');
                            c.lang = 'en';
                            assert.equal(c.formatAge(5 * 60 * 1000), 'You last entered data 5 min ago');
                            assert.equal(c.formatAge(24 * 3600 * 1000), 'You last entered data 1 day ago');
                            assert.equal(c.formatAge(2 * 24 * 3600 * 1000), 'You last entered data 2 days ago');
                        });

                        QUnit.test('Persistence stays inert without Alpine', function(assert) {
                            const c = wbCalculator();
                            c.init();
                            c.load.pilot = 75;
                            c.update();
                            assert.strictEqual(localStorage.getItem(KEY), null, 'Plain instances never write');

                            localStorage.setItem(KEY, JSON.stringify({ v: 1, savedAt: 1, state: { load: { pilot: 99, copilot: 0, baggage: 0 } } }));
                            const d = wbCalculator();
                            d.init();
                            assert.strictEqual(d.load.pilot, null, 'Plain instances never read');
                        });
                    });
                };

            }
