<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipistrel Alpha Trainer - W&B</title>
    <link rel="icon" type="image/png" href="assets/light_aircraft_favicon.png">
    <link rel="stylesheet" href="assets/tailwind.css?v=4d255223">
    <!-- Alpine JS (v3.15.12 pinned, served locally so the app works offline) -->
    <script defer src="assets/alpinejs-3.15.12.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        canvas { border: 1px solid #e5e7eb; background-color: #fff; }
        /* ~44px touch targets for finger use (preflight from a phone) */
        #main-app input[type="number"], #main-app select { min-height: 44px; }
        .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 9999px; margin-right: 4px; vertical-align: middle; }
        .legend-box { display: inline-block; width: 14px; height: 11px; border: 2px solid #475569; background: rgba(22, 163, 74, 0.08); margin-right: 4px; vertical-align: middle; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- APP CONTAINER (hidden when test=true) -->
    <!-- No x-init: Alpine already auto-calls the data object's init(); having both ran it twice -->
    <div id="main-app" class="max-w-4xl mx-auto p-4" x-data="wbCalculator()" x-cloak>

        <!-- Header & Toggles -->
        <header class="mb-6 border-b pb-4 border-gray-300 flex flex-col md:flex-row justify-between items-start md:items-end">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Pipistrel Alpha Trainer</h1>
                <p class="text-gray-600" x-text="t('subtitle')"></p>
            </div>

            <div class="mt-4 md:mt-0 flex flex-col items-end gap-2">
                <!-- Language Switcher -->
                <div class="flex bg-gray-200 rounded-lg p-1">
                    <button @click="setLang('es')" :class="lang === 'es' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'" class="px-3 py-1 rounded-md text-xs font-bold transition-all">ES</button>
                    <button @click="setLang('en')" :class="lang === 'en' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'" class="px-3 py-1 rounded-md text-xs font-bold transition-all">EN</button>
                </div>
                <!-- Unit Switcher -->
                <div class="flex bg-gray-200 rounded-lg p-1">
                    <button @click="setUnits('metric')" :class="units === 'metric' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'" class="px-4 py-2 rounded-md text-sm font-bold transition-all" x-text="t('metric')"></button>
                    <button @click="setUnits('imperial')" :class="units === 'imperial' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'" class="px-4 py-2 rounded-md text-sm font-bold transition-all" x-text="t('imperial')"></button>
                </div>
            </div>
        </header>

        <!-- STATUS SUMMARY: W&B, load and fuel as separate states. Sticky on all screen sizes. -->
        <div class="sticky top-0 z-20 mb-6">
            <div class="bg-white rounded-lg shadow border border-gray-200 p-3">
                <div x-show="!planeSelected" class="text-center text-sm font-bold text-red-600 py-1" x-text="t('select_prompt')"></div>
                <div x-show="planeSelected" class="grid grid-cols-3 md:grid-cols-5 gap-2 text-center">
                    <!-- Weight and CG rest on the empty weight, the pilot AND the fuel: while
                         any of them is pending they show a dash, not a figure standing on an
                         implicit 0 -->
                    <div>
                        <div class="text-xs text-gray-500" x-text="t('sum_weight_to')"></div>
                        <div class="text-sm font-bold" :class="wbPending ? 'text-gray-500' : ((results.takeoff.weight > currentLimits.mtom || results.takeoff.weight < currentLimits.minW) ? 'text-red-600' : 'text-slate-800')"
                             x-text="fmt(results.takeoff.weight, labels.weight, wbPending)"></div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500" x-text="t('sum_cg_to')"></div>
                        <div class="text-sm font-bold" :class="wbPending ? 'text-gray-500' : ((results.takeoff.cg < currentLimits.fwd || results.takeoff.cg > currentLimits.aft) ? 'text-red-600' : 'text-slate-800')"
                             x-text="fmt(results.takeoff.cg, labels.arm, wbPending)"></div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500" x-text="t('sum_cg_ldg')"></div>
                        <div class="text-sm font-bold" :class="wbPending ? 'text-gray-500' : ((results.landing.cg < currentLimits.fwd || results.landing.cg > currentLimits.aft) ? 'text-red-600' : 'text-slate-800')"
                             x-text="fmt(results.landing.cg, labels.arm, wbPending)"></div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500" x-text="t('sum_load')"></div>
                        <div class="text-sm font-bold" :class="dataPending ? 'text-gray-500' : (hasLoadErrors ? 'text-red-600' : 'text-green-600')" x-text="dataPending ? t('sum_pending') : (hasLoadErrors ? t('sum_check') : 'OK')"></div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500" x-text="t('sum_fuel')"></div>
                        <div class="text-sm font-bold" :class="fuelSummaryClass" x-text="fuelSummaryLabel"></div>
                    </div>
                </div>
                <!-- Data age clock + reset: appears once something has been entered -->
                <div x-show="savedAt !== null" class="mt-2 pt-2 border-t border-gray-100 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-xs" x-cloak>
                    <span class="flex items-center gap-1" :class="dataAgeClass">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span x-text="dataAge"></span>
                    </span>
                    <button @click="reset()" class="font-bold text-red-600 underline px-2 py-1" x-text="t('reset_button')"></button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- INPUTS -->
            <div class="space-y-6">

                <!-- 1. Aircraft Selection -->
                <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-500">
                    <h2 class="font-bold text-lg mb-3 text-slate-700 border-b pb-1" x-text="t('sec_aircraft')"></h2>
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-gray-700 mb-1" x-text="t('registration')"></label>
                        <select x-model="selectedPlaneId" @change="loadPlaneData()"
                            :class="planeSelected ? 'border-blue-300 bg-blue-50' : 'border-red-500 bg-red-50'"
                            class="w-full p-2 border rounded font-bold text-slate-700 focus:ring-blue-500 focus:border-blue-500">
                            <option value="" disabled x-text="t('select_plane')"></option>
                            <template x-for="plane in fleet" :key="plane.id">
                                <option :value="plane.id" x-text="plane.id === 'custom' ? t('custom_plane') : plane.name"></option>
                            </template>
                        </select>
                        <!-- Selected aircraft metadata (S/N, POH document) -->
                        <p class="text-xs text-gray-500 mt-1" x-show="currentPlaneMeta" x-text="currentPlaneMeta"></p>
                        <!-- Fleet file could not be read: the registrations are simply not
                             there, so say it rather than let the list look complete -->
                        <p x-show="fleetFailed" class="text-xs bg-amber-50 border border-amber-300 text-amber-800 p-2 rounded mt-1 fade-in" x-cloak>
                            ⚠️ <span x-text="t('fleet_error')"></span>
                        </p>
                        <p x-show="fleetSkipped > 0" class="text-xs bg-amber-50 border border-amber-300 text-amber-800 p-2 rounded mt-1 fade-in" x-cloak>
                            ⚠️ <span x-text="t('fleet_skipped').replace('{n}', fleetSkipped)"></span>
                        </p>
                        <!-- Empty weight moves with repaints, instruments and reweighing -->
                        <p x-show="currentPlaneWeighingDate" class="text-xs text-gray-500 mt-1" x-cloak>
                            <span x-text="t('weighed_on')"></span> <span x-text="currentPlaneWeighingDate"></span>
                        </p>
                        <p x-show="currentPlaneUndated" class="text-xs text-amber-600 font-semibold mt-1 fade-in" x-cloak>
                            ⚠️ <span x-text="t('weighing_undated')"></span>
                        </p>
                        <!-- The manifest is the authority on this aircraft's CG limits; when it
                             has not stated them, the envelope in use is the type's -->
                        <p x-show="currentPlaneLimitsFromType" class="text-xs text-amber-600 font-semibold mt-1 fade-in" x-cloak>
                            ⚠️ <span x-text="t('limits_from_type')"></span>
                        </p>
                        <p x-show="currentPlaneNote" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 p-2 rounded mt-1 fade-in" x-cloak x-text="currentPlaneNote"></p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600"><span x-text="t('empty_weight')"></span> (<span x-text="labels.weight"></span>)</label>
                            <input type="number" step="0.1" min="0"
                                x-model.number="aircraft.weight"
                                @input="update"
                                :disabled="selectedPlaneId !== 'custom'"
                                :class="selectedPlaneId !== 'custom' ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'bg-white text-gray-800'"
                                class="w-full mt-1 p-2 border rounded focus:ring-blue-500 focus:border-blue-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600"><span x-text="t('empty_arm')"></span> (<span x-text="labels.arm"></span>)</label>
                            <input type="number" step="0.1"
                                x-model.number="aircraft.arm"
                                @input="update"
                                :disabled="selectedPlaneId !== 'custom'"
                                :class="selectedPlaneId !== 'custom' ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'bg-white text-gray-800'"
                                class="w-full mt-1 p-2 border rounded focus:ring-blue-500 focus:border-blue-500 transition-colors">
                        </div>
                    </div>
                </div>

                <!-- 2. Load -->
                <div class="bg-white p-5 rounded-lg shadow border-l-4" :class="hasLoadErrors ? 'border-red-500' : 'border-gray-200'">
                    <!-- The panel edge turns red only for a limit that is actually broken;
                         a pending field speaks through its own amber note below -->

                    <h2 class="font-bold text-lg mb-3 text-slate-700 border-b pb-1" x-text="t('sec_load')"></h2>
                    <div class="space-y-4">
                        <!-- PILOT -->
                        <div>
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700 w-1/3"><span x-text="t('pilot')"></span> (<span x-text="labels.weight"></span>)</label>
                                <input type="number" min="0" x-model.number="load.pilot" @input="update"
                                    :class="Number.isFinite(load.pilot) && (load.pilot > currentLimits.maxSeat || load.pilot < currentLimits.minPilot) ? 'border-red-500 bg-red-50 text-red-700 font-bold' : 'border-gray-300'"
                                    class="w-24 p-1 border rounded text-right transition-colors focus:ring-2 focus:ring-blue-200 outline-none">
                                <span class="text-xs text-gray-400 w-auto ml-2 text-right">
                                    <span x-text="t('arm')"></span> (<span x-text="labels.arm"></span>):
                                    <span x-text="currentArms.pilot"></span>
                                </span>
                            </div>
                            <!-- MAX SEAT WEIGHT ALERT -->
                            <div x-show="load.pilot > currentLimits.maxSeat" class="text-xs bg-red-100 text-red-700 p-1 rounded mt-1 text-right fade-in border border-red-200">
                                ⚠️ <span class="font-bold" x-text="t('alert')"></span> <span x-text="t('err_seat_max')"></span> (> <span x-text="currentLimits.maxSeat"></span> <span x-text="labels.weight"></span>)
                            </div>
                            <!-- Empty and below-minimum are different situations: 'below
                                 minimum' makes no sense for a field never filled in -->
                            <div x-show="!Number.isFinite(load.pilot)" class="text-xs text-amber-600 font-bold mt-1 text-right fade-in">⚠️ <span x-text="t('err_pilot_required')"></span></div>
                            <div x-show="Number.isFinite(load.pilot) && load.pilot < currentLimits.minPilot" class="text-xs text-amber-600 font-bold mt-1 text-right fade-in">⚠️ <span x-text="t('err_pilot_min')"></span> (&lt; <span x-text="currentLimits.minPilot"></span> <span x-text="labels.weight"></span>)</div>
                        </div>

                        <!-- CO-PILOT -->
                        <div>
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700 w-1/3"><span x-text="t('copilot')"></span> (<span x-text="labels.weight"></span>)</label>
                                <input type="number" min="0" x-model.number="load.copilot" @input="update"
                                    :class="load.copilot > currentLimits.maxSeat ? 'border-red-500 bg-red-50 text-red-700 font-bold' : 'border-gray-300'"
                                    class="w-24 p-1 border rounded text-right transition-colors focus:ring-2 focus:ring-blue-200 outline-none">
                                <span class="text-xs text-gray-400 w-auto ml-2 text-right">
                                    <span x-text="t('arm')"></span> (<span x-text="labels.arm"></span>):
                                    <span x-text="currentArms.copilot"></span>
                                </span>
                            </div>
                            <!-- MAX SEAT WEIGHT ALERT -->
                            <div x-show="load.copilot > currentLimits.maxSeat" class="text-xs bg-red-100 text-red-700 p-1 rounded mt-1 text-right fade-in border border-red-200">
                                ⚠️ <span class="font-bold" x-text="t('alert')"></span> <span x-text="t('err_seat_max')"></span> (> <span x-text="currentLimits.maxSeat"></span> <span x-text="labels.weight"></span>)
                            </div>
                        </div>

                        <!-- STRUCTURAL ALERT (max occupants) -->
                        <div x-show="(load.pilot + load.copilot) > currentLimits.maxOccupants" class="bg-red-100 border border-red-400 text-red-700 px-2 py-1 rounded text-xs text-center fade-in">
                            ⚠️ <strong x-text="t('err_struct_title')"></strong> <span x-text="t('err_struct_msg') + ' ' + currentLimits.maxOccupants"></span>.
                        </div>

                        <!-- BAGGAGE -->
                        <div class="pt-2 border-t">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700 w-1/3"><span x-text="t('baggage')"></span> (<span x-text="labels.weight"></span>)</label>
                                <input type="number" min="0" x-model.number="load.baggage" @input="update" :class="load.baggage > currentLimits.maxBaggage ? 'border-red-500 bg-red-50' : 'border-gray-300'" class="w-24 p-1 border rounded text-right transition-colors">
                                <span class="text-xs text-gray-400 w-auto ml-2 text-right">
                                    <span x-text="t('arm')"></span> (<span x-text="labels.arm"></span>):
                                    <span x-text="currentArms.baggage"></span>
                                </span>
                            </div>
                            <div x-show="load.baggage > currentLimits.maxBaggage" class="text-xs text-red-600 font-bold mt-1 text-right fade-in">⚠️ <span x-text="t('err_bag_max')"></span></div>
                        </div>
                    </div>
                </div>

                <!-- 3. Performance & Fuel -->
                <div class="bg-white p-5 rounded-lg shadow">
                    <h2 class="font-bold text-lg mb-3 text-slate-700 border-b pb-1" x-text="t('sec_perf')"></h2>
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-gray-700 mb-1" x-text="t('power_setting')"></label>
                        <select x-model="selectedPerfIndex" @change="update" class="w-full p-2 border border-green-300 bg-green-50 rounded text-sm font-semibold text-slate-700">
                            <template x-for="(profile, index) in perfProfiles" :key="index">
                                <option :value="index" x-text="profile.hp + '% HP @ ' + profile.rpm + ' RPM (' + profile.ktas + ' KTAS)'"></option>
                            </template>
                        </select>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <label class="text-sm font-medium text-gray-700"><span x-text="t('fuel_start')"></span> (<span x-text="labels.fuel"></span>)</label>
                            <!-- Input max = total tank capacity per unit system; update() clamps as well -->
                            <input type="number" min="0" :max="currentLimits.maxFuelTotal" x-model.number="fuel.startAmount" @input="update" class="w-24 p-1 border rounded text-right font-bold text-blue-600">
                        </div>

                        <!-- ALERT: fuel entered but at or below the unusable amount -->
                        <div x-show="fuelBelowUnusable" class="text-xs bg-red-100 border border-red-400 text-red-700 p-2 rounded mt-1 fade-in font-bold">
                            ⚠️ <span x-text="t('warn_fuel_unusable')"></span> (<span x-text="currentUnusableFuel"></span> <span x-text="labels.fuel"></span>)
                        </div>
                        <div class="flex justify-between items-center">
                            <label class="text-sm font-medium text-gray-700"><span x-text="t('flight_time')"></span></label>
                            <input type="number" min="0" step="0.1" x-model.number="fuel.flightTime" @input="update" class="w-24 p-1 border rounded text-right">
                        </div>
                        <div class="text-sm text-gray-600 bg-gray-50 p-2 rounded border space-y-2">
                             <div class="flex justify-between">
                                <span x-text="t('fuel_flow')"></span>
                                <span class="font-bold" x-text="currentFuelFlow + ' ' + labels.flow"></span>
                            </div>
                            <div class="flex justify-between">
                                <span x-text="t('total_cons')"></span>
                                <span x-text="fuelResults.burnedAmount.toFixed(1) + ' ' + labels.fuel"></span>
                            </div>
                            <div class="flex justify-between font-bold" :class="fuelPending ? 'text-gray-500' : (fuelResults.remainingAmount < 0 ? 'text-red-600' : 'text-green-600')">
                                <span x-text="t('fuel_rem')"></span>
                                <span x-text="fmt(fuelResults.remainingAmount, labels.fuel, fuelPending)"></span>
                            </div>
                            <!-- Read as a pair: what the plan asks for vs. what the fuel gives -->
                            <div class="flex justify-between border-t pt-1 text-blue-700">
                                <span x-text="t('est_range')"></span>
                                <span>~<span class="font-bold" x-text="fuelResults.rangeNM"></span> NM</span>
                            </div>
                            <div class="flex justify-between text-blue-700">
                                <span>
                                    <span x-text="t('endurance')"></span>
                                    <!-- The reserve caveat rides under the label so the figure stays on one line -->
                                    <span class="block text-xs text-blue-500" x-text="t('endurance_note')"></span>
                                </span>
                                <span class="whitespace-nowrap ml-2" :class="fuelPending ? 'text-gray-500' : ''">
                                    <template x-if="fuelPending">
                                        <span class="font-bold">---</span>
                                    </template>
                                    <template x-if="!fuelPending">
                                        <span>
                                            <span class="font-bold" x-text="fuelResults.enduranceHours.toFixed(1)"></span> h
                                            (~<span class="font-bold" x-text="fuelResults.enduranceNM"></span> NM)
                                        </span>
                                    </template>
                                </span>
                            </div>
                        </div>
                        <div x-show="!fuelPending && fuelResults.remainingAmount < 0" class="p-2 bg-red-100 border border-red-400 text-red-700 text-xs rounded fade-in">
                            ⚠️ <strong x-text="t('danger')"></strong>: <span x-text="t('err_fuel')"></span>
                        </div>
                        <!-- LOW RESERVE ALERT (< 30 min) -->
                        <div x-show="!fuelPending && fuelResults.remainingAmount >= 0 && fuelResults.remainingTime < 0.5" class="mt-2 p-2 bg-amber-100 border border-amber-400 text-amber-800 text-xs rounded fade-in">
                            ⚠️ <strong x-text="t('warn_fuel_res')"></strong>
                            (<span x-text="Math.floor(fuelResults.remainingTime * 60)"></span> min)
                        </div>
                    </div>
                </div>
            </div>

            <!-- OUTPUTS -->
            <div class="space-y-6">
                <!-- No registration selected, no results: prevents a green state built on generic data -->
                <div x-show="!planeSelected" class="bg-white p-5 rounded-lg shadow border-l-4 border-red-500">
                    <p class="text-sm font-bold text-red-600" x-text="t('select_prompt')"></p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow" x-show="planeSelected">
                    <h2 class="font-bold text-lg mb-3 text-slate-700 border-b pb-1" x-text="t('results')"></h2>
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100 text-gray-600">
                            <tr>
                                <th class="p-2" x-text="t('phase')"></th>
                                <th class="p-2">
                                    <span x-text="t('weight')"></span> (<span x-text="labels.weight"></span>)
                                </th>
                                <th class="p-2">
                                    CG (<span x-text="labels.arm"></span>)
                                </th>
                                <th class="p-2" x-text="t('status')"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            <tr>
                                <td class="p-2 font-bold text-blue-600" x-text="t('phase_to')"></td>
                                <td class="p-2" x-text="num(results.takeoff.weight)"></td>
                                <td class="p-2" x-text="num(results.takeoff.cg)"></td>
                                <td class="p-2"><span class="inline-flex items-center gap-1.5 text-xs font-semibold" :class="statusTextClass(results.takeoff)"><span class="w-2 h-2 rounded-full shrink-0" :class="statusDotClass(results.takeoff)"></span><span x-text="statusLabel(results.takeoff)"></span></span></td>
                            </tr>
                            <tr>
                                <td class="p-2 font-bold text-green-600" x-text="t('phase_ldg')"></td>
                                <td class="p-2" x-text="num(results.landing.weight)"></td>
                                <td class="p-2" x-text="num(results.landing.cg)"></td>
                                <td class="p-2"><span class="inline-flex items-center gap-1.5 text-xs font-semibold" :class="statusTextClass(results.landing)"><span class="w-2 h-2 rounded-full shrink-0" :class="statusDotClass(results.landing)"></span><span x-text="statusLabel(results.landing)"></span></span></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="mt-4 space-y-2">
                        <!-- Gated on wbPending: a weight built on a missing empty weight, pilot
                             or tank reading is not under the minimum, it is simply not known yet -->
                        <div x-show="showLimitWarnings && results.takeoff.weight > currentLimits.mtom" class="text-xs text-red-600 font-bold fade-in">⚠️ <span x-text="t('warn_mtom')"></span></div>
                        <div x-show="showLimitWarnings && results.takeoff.weight < currentLimits.minW" class="text-xs text-red-600 font-bold fade-in">⚠️ <span x-text="t('warn_minw_to')"></span></div>
                        <div x-show="showLimitWarnings && results.landing.weight < currentLimits.minW" class="text-xs text-red-600 font-bold fade-in">⚠️ <span x-text="t('warn_minw_ldg')"></span></div>
                        <div x-show="showLimitWarnings && (results.takeoff.cg < currentLimits.fwd || results.takeoff.cg > currentLimits.aft)" class="text-xs text-red-600 font-bold fade-in">⚠️ <span x-text="t('warn_cg_to')"></span></div>

                // --- AIRCRAFT TYPES (certified data, POH section 2.6) ---

                // Both types carry the same envelope. The handbooks all define it as
                // 25 % to 37 % MAC and all print the same conversion,
                // CG%MAC = 100 x (CGmm - 40) / 900, which puts 25 % at 265 mm and 37 % at
                // 373 mm. The Trainer handbooks print 265 mm; the PRO prints 267 mm while
                // its own inches (10 7/16 = 265.1 mm) and its own formula still say 265, so
                // the 267 looks like a typo carried into the club's checklist. We use 267
                // for both because it is the more restrictive reading, which is where a
                // doubtful limit belongs, and because it matches the checklist flown with.
                // Sources: POH-162-00-40-001 rev. A07 (Alpha Trainer) and
                // POH-162-00-40-003 rev. B01 (Alpha Trainer PRO), section 6.2.
                aircraftTypes: {
                    alpha_trainer: {
                        name: 'Alpha Trainer',
                        poh: 'POH-162-00-40-001_A07',
                        limits: { metric: { fwd: 267, aft: 373 }, imperial: { fwd: 10.5, aft: 14.7 } },
                        sample: { metric: { weight: 293.6, arm: 254 }, imperial: { weight: 647.6, arm: 10 } }

                        name: 'Alpha Trainer PRO',
                        poh: 'POH-162-00-40-003_B01',
                        limits: { metric: { fwd: 267, aft: 373 }, imperial: { fwd: 10.5, aft: 14.7 } },
                        sample: { metric: { weight: 308, arm: 254 }, imperial: { weight: 679, arm: 10 } }
                    }

                // weight and arm belong to each airframe's weight and balance report, not
                // to the type: POH 6.2 says as much, and those figures change with every
                // repaint, instrument change and periodic reweighing.
                FLEET_URL: 'datasets/fleet.json',
                fleetStatus: 'idle',   // 'idle' | 'loading' | 'ready' | 'error'
                fleetSkipped: 0,       // entries the file carried but validation rejected

                RESERVED_IDS: ['custom', 'alpha_trainer', 'alpha_trainer_pro'],

                selectedPlaneId: '',

                    { hp: 65, rpm: 4800, lts: 11.0, gal: 3.0, ktas: 95 },

                    { hp: 55, rpm: 4300, lts: 9.0,  gal: 2.4, ktas: 75 }
                ],
                selectedPerfIndex: 0,
                constants: {
                    metric: {
                        arms: { pilot: 370, copilot: 370, fuel: 1130, baggage: 930 },
                        // maxFuelTotal is the TOTAL tank capacity (POH 2.8), not the usable amount:
                        // 50 L total - 2 L unusable = 48 L usable. The unusable fuel is already part
                        // of the empty weight (POH 1.7.5), so only the usable part gets loaded here.
                        limits: { mtom: 550, fwd: 267, aft: 373, minW: 348.5, maxSeat: 110, maxOccupants: 200, minPilot: 55, maxBaggage: 10, maxFuelTotal: 50 },
                        unusableFuel: 2.0,
                        fuelDensity: 0.72
                    },
                    imperial: {

                        arms: { pilot: 14.5, copilot: 14.5, fuel: 44.5, baggage: 36.6 },
                        // Same contract as the metric block: 13.2 gal total - 0.5 unusable = 12.7 usable.
                        // These are the values the POH publishes, not conversions of the metric ones.
                        limits: { mtom: 1212.5, fwd: 10.5, aft: 14.7, minW: 768.31, maxSeat: 242, maxOccupants: 440, minPilot: 121, maxBaggage: 22, maxFuelTotal: 13.2 },
                        unusableFuel: 0.5,
                        fuelDensity: 6.0
                    }
                },
                aircraft: { weight: null, arm: null },
                activeLimits: { fwd: 267, aft: 373 },
                // Pilot and fuel start empty: forces real data entry (prevents an accidental OK)
                load: { pilot: null, copilot: 0, baggage: 0 },
                fuel: { startAmount: null, flightTime: 1.0 },
                fuelResults: { burnedAmount: 0, remainingAmount: 0, remainingTime: 0, weightStart: 0, weightEnd: 0, rangeNM: 0, enduranceHours: 0, enduranceNM: 0 },
                results: {
                    takeoff: { weight: 0, moment: 0, cg: 0, isValid: true },
                    landing: { weight: 0, moment: 0, cg: 0, isValid: true }
                },

                get labels() { return this.units === 'metric' ? { weight: 'kg', arm: 'mm', fuel: 'L', flow: 'L/h' } : { weight: 'lbs', arm: 'in', fuel: 'gal', flow: 'GPH' }; },
                get currentArms() { return this.units === 'metric' ? this.constants.metric.arms : this.constants.imperial.arms; },
                get currentLimits() {
                    // Fixed structural constants (MTOM, max seat weight, etc.)
                    const baseLimits = this.units === 'metric' ? this.constants.metric.limits : this.constants.imperial.limits;

                    // Merge: structural constants + the current aircraft FWD/AFT limits
                    return {
                        ...baseLimits,
                        fwd: this.activeLimits.fwd,
                        aft: this.activeLimits.aft
                    };
                },
                get currentFuelFlow() { const p = this.perfProfiles[this.selectedPerfIndex]; return this.units === 'metric' ? p.lts : p.gal; },
                get currentUnusableFuel() { return this.units === 'metric' ? this.constants.metric.unusableFuel : this.constants.imperial.unusableFuel; },
                // Guarded against null/'' from the empty input: in JS both null >= 0 and null <= 2 are true
                get fuelBelowUnusable() {
                    return Number.isFinite(this.fuel.startAmount) && this.fuel.startAmount >= 0 &&
                           this.fuel.startAmount <= this.currentUnusableFuel;
                },
                get planeSelected() { return this.selectedPlaneId !== ''; },
                get currentPlaneMeta() { const p = this.fleet.find(p => p.id === this.selectedPlaneId); return (p && p.meta) || ''; },
                // An undeclared tank is not an empty tank: with startAmount pending the
                // remaining fuel computes to minus one hour of burn, which used to read as
                // "INSUFFICIENT / DANGER" on a form nobody had filled in yet.
                get fuelPending() { return !Number.isFinite(this.fuel.startAmount); },
                // Fuel status light, independent from the W&B state (the table badge is W&B only)
                get fuelStatus() {
                    if (this.fuelPending) return 'pending';
                    if (this.fuelResults.remainingAmount < 0) return 'danger';
                    if (this.fuelResults.remainingTime < 0.5) return 'warning';
                    return 'ok';
                },
                get fuelSummaryLabel() {
                    return { pending: this.t('sum_fuel_pending'), danger: this.t('sum_fuel_danger'),
                             warning: this.t('sum_fuel_warn'), ok: 'OK' }[this.fuelStatus];
                },
                get fuelSummaryClass() {
                    return { pending: 'text-gray-500', danger: 'text-red-600',
                             warning: 'text-amber-600', ok: 'text-green-600' }[this.fuelStatus];
                },
                // Figures that lean on a pending input show a dash instead of a number built
                // on an implicit 0, the same way the takeoff calculator's format() does.
                fmt(value, unit, pending) {
                    return pending ? '---' : value.toFixed(1) + ' ' + unit;
                },
                // Bare variant for the results and breakdown tables, where the unit already
                // lives in the column header. Any figure the fuel feeds into waits with it.
                num(value) {
                    return this.wbPending ? '---' : value.toFixed(1);
                },
                // A field nobody filled in is not an error, it is a missing input. Keeping
                // the two apart is what lets the UI say "enter the pilot weight" instead of
                // "the pilot is below the 55 kg minimum" about a value that was never typed,
                // and it stops a blank form from painting itself red on load.
                // Same split the takeoff calculator makes with its 'pending' validity.
                get dataPending() {
                    return !Number.isFinite(this.load.pilot)
                        || !Number.isFinite(this.aircraft.weight)
                        || !Number.isFinite(this.aircraft.arm);
                },
                // Everything the takeoff weight and CG are made of. Fuel is its own input
                // with its own light, but a takeoff weight computed without a declared tank
                // is not a takeoff weight: it silently weighs the aircraft with 0 L on board
                // and can land inside the envelope on paper while the real one sits outside.
                // So the load light stays about the load, the fuel light about the fuel, and
                // the W&B figures wait for both.
                get wbPending() { return this.dataPending || this.fuelPending; },
                // One gate for every red limit warning in the results panel. They were
                // gated individually first and the two CG ones got missed, which is exactly
                // the failure a single flag prevents.
                get showLimitWarnings() { return !this.wbPending; },
                // Limits actually broken by values that ARE there. Every other comparison
                // here is a > against a limit, and null > n is false, so only the minimum
                // needs the explicit guard.
                get hasLoadErrors() {
                    const lim = this.currentLimits;
                    return (this.load.pilot > lim.maxSeat) ||
                           (Number.isFinite(this.load.pilot) && this.load.pilot < lim.minPilot) ||
                           (this.load.copilot > lim.maxSeat) ||
                           ((this.load.pilot + this.load.copilot) > lim.maxOccupants) || (this.load.baggage > lim.maxBaggage);
                },
                // 'pending' | 'limit' | 'ok' for one of the two W&B points (takeoff/landing).
                // Annunciator colors follow the takeoff calculator: grey while pending, so a
                // half-filled form never shows a green "within limits" it cannot back up.
                pointStatus(point) {
                    if (this.wbPending) return 'pending';
                    return point.isValid && !this.hasLoadErrors ? 'ok' : 'limit';
                },
                statusLabel(point) {
                    return { ok: this.t('status_ok'), limit: this.t('status_limit'), pending: this.t('status_pending') }[this.pointStatus(point)];
                },
                statusTextClass(point) {
                    return { ok: 'text-green-700', limit: 'text-red-700', pending: 'text-gray-500' }[this.pointStatus(point)];
                },
                statusDotClass(point) {
                    return { ok: 'bg-green-500', limit: 'bg-red-500', pending: 'bg-gray-400' }[this.pointStatus(point)];
                },

                init() {
                    if (this.persistenceActive) {
                        // Real Alpine context: restore the saved session, then enable saves.
                        const boot = () => {
                            this.restoreState();
                            this.update();
                            this._persistReady = true;
                            // Re-render the data-age label every 30 s
                            setInterval(() => { this.now = Date.now(); }, 30000);
                        };
                        this.update();
                        // The fleet has to be in place before restoring: restoreState()
                        // validates the saved registration against it, so restoring first
                        // would drop a saved CX-MAC session as if the aircraft were unknown.
                        // Returned rather than fired and forgotten so the suite can await it;
                        // Alpine ignores the return value.
                        return this.loadFleet().then(() => {
                            // Then nextTick: the x-for options of the registration select
                            // must exist before x-model can display a restored registration
                            // (restoring earlier leaves the select showing the wrong plane).
                            if (typeof this.$nextTick === 'function') this.$nextTick(boot); else boot();
                        });
                    }
                    // Plain factory instance (QUnit): no persistence, no fetch. Tests that
                    // need a fleet call applyFleetPayload() with their own data.
                    this.update();
                    return Promise.resolve();
                },

                t(key) {
                    return this.vocab[this.lang][key] || key;
                },

                setLang(l) {
                    this.lang = l;
                    this.drawChart(); // canvas axis titles are not reactive
                    this.saveState(false);
                },

                // --- PERSISTENCE, RESET & DATA AGE ---
                // Active only inside Alpine ($watch exists): plain QUnit factory
                // instances stay inert unless a test stubs $watch on purpose.
                get persistenceActive() { return typeof this.$watch === 'function'; },
                // touch=false persists preferences (lang/units) without refreshing the
                // age clock: savedAt keeps meaning "last time DATA was entered".
                saveState(touch = true) {
                    if (!this.persistenceActive || !this._persistReady || this._suppressSave) return;
                    if (touch && !this._suppressTouch) this.savedAt = Date.now();
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify({
                            v: 1,
                            savedAt: this.savedAt,
                            state: {
                                lang: this.lang,
                                units: this.units,
                                selectedPlaneId: this.selectedPlaneId,
                                selectedPerfIndex: this.selectedPerfIndex,
                                aircraft: { weight: this.aircraft.weight, arm: this.aircraft.arm },
                                activeLimits: { fwd: this.activeLimits.fwd, aft: this.activeLimits.aft },
                                load: { pilot: this.load.pilot, copilot: this.load.copilot, baggage: this.load.baggage },
                                fuel: { startAmount: this.fuel.startAmount, flightTime: this.fuel.flightTime },
                            }
                        }));
                    } catch (e) { /* private mode / storage full: keep calculating */ }
                },
                restoreState() {
                    if (!this.persistenceActive) return;
                    let payload = null;
                    try { payload = JSON.parse(localStorage.getItem(this.STORAGE_KEY)); } catch (e) { return; }
                    if (!payload || payload.v !== 1 || typeof payload.state !== 'object' || payload.state === null) return;
                    const s = payload.state;
                    const finiteOrNull = v => v === null || Number.isFinite(v);
                    if (['es', 'en'].includes(s.lang)) this.lang = s.lang;
                    if (['metric', 'imperial'].includes(s.units)) this.units = s.units;
                    if (s.selectedPlaneId === '' || this.fleet.some(p => p.id === s.selectedPlaneId)) this.selectedPlaneId = s.selectedPlaneId;
                    if (Number.isInteger(s.selectedPerfIndex) && s.selectedPerfIndex >= 0 && s.selectedPerfIndex < this.perfProfiles.length) this.selectedPerfIndex = s.selectedPerfIndex;
                    // Raw objects on purpose: loadPlaneData() would wipe a custom aircraft.
                    // For fleet planes the raw values match what loadPlaneData would set,
                    // because units is restored along with them.
                    if (s.aircraft && finiteOrNull(s.aircraft.weight) && finiteOrNull(s.aircraft.arm)) this.aircraft = { weight: s.aircraft.weight, arm: s.aircraft.arm };
                    if (s.activeLimits && Number.isFinite(s.activeLimits.fwd) && Number.isFinite(s.activeLimits.aft)) this.activeLimits = { fwd: s.activeLimits.fwd, aft: s.activeLimits.aft };
                    if (s.load && finiteOrNull(s.load.pilot) && Number.isFinite(s.load.copilot) && Number.isFinite(s.load.baggage)) this.load = { pilot: s.load.pilot, copilot: s.load.copilot, baggage: s.load.baggage };
                    if (s.fuel && finiteOrNull(s.fuel.startAmount) && Number.isFinite(s.fuel.flightTime) && s.fuel.flightTime >= 0) this.fuel = { startAmount: s.fuel.startAmount, flightTime: s.fuel.flightTime };
                    if (Number.isFinite(payload.savedAt)) this.savedAt = payload.savedAt;
                },
                // Clears the saved session and the flight data; lang and units are UI
                // preferences and survive the reset.
                reset() {
                    this._suppressSave = true;
                    try { localStorage.removeItem(this.STORAGE_KEY); } catch (e) {}
                    this.savedAt = null;
                    const fresh = wbCalculator();
                    this.selectedPlaneId = fresh.selectedPlaneId;
                    this.selectedPerfIndex = fresh.selectedPerfIndex;
                    this.aircraft = { ...fresh.aircraft };
                    this.activeLimits = { ...fresh.activeLimits };
                    this.load = { ...fresh.load };
                    this.fuel = { ...fresh.fuel };
                    this.update();
                    this._suppressSave = false;
                },
                get dataAge() {
                    return this.savedAt === null ? '' : this.formatAge(this.now - this.savedAt);
                },
                // Stale data gets a visual nudge instead of an expiry
                get dataAgeClass() {
                    if (this.savedAt === null) return '';
                    const ms = this.now - this.savedAt;
                    if (ms >= 24 * 3600 * 1000) return 'text-red-600 font-bold';
                    if (ms >= 6 * 3600 * 1000) return 'text-amber-600';
                    return 'text-gray-500';
                },
                // This page's t() does not interpolate, so {n} is replaced here
                formatAge(ms) {
                    const mins = Math.floor(ms / 60000);
                    if (mins < 1) return this.t('age_just_now');
                    if (mins < 60) return this.t('age_min').replace('{n}', mins);
                    const hours = Math.floor(mins / 60);
                    if (hours < 24) return this.t('age_hours').replace('{n}', hours);
                    const days = Math.floor(hours / 24);
                    return this.t(days === 1 ? 'age_day' : 'age_days').replace('{n}', days);
                },

                // --- FLEET FILE ---
                // Validation is deliberately as strict as restoreState()'s: the file sits
                // outside the code and outside the test suite, so nothing in it is trusted.
                // A rejected entry is dropped and counted, never repaired with defaults.
                validateFleetEntry(entry) {
                    if (!entry || typeof entry !== 'object' || Array.isArray(entry)) return null;
                    const id = entry.registration;
                    if (typeof id !== 'string' || id.trim() === '') return null;
                    if (this.RESERVED_IDS.includes(id)) return null;          // cannot shadow handbook entries
                    if (this.fleet.some(p => p.id === id)) return null;       // nor duplicate another registration
                    const type = this.aircraftTypes[entry.type];
                    if (!type) return null;                                   // unknown type: no limits to apply
                    const w = entry.empty_weight, a = entry.empty_arm;
                    if (!w || !a || typeof w !== 'object' || typeof a !== 'object') return null;
                    if (!(Number.isFinite(w.kg) && w.kg > 0 && Number.isFinite(w.lbs) && w.lbs > 0)) return null;
                    if (!(Number.isFinite(a.mm) && a.mm > 0 && Number.isFinite(a.in) && a.in > 0)) return null;

                    // The manifest is the authority on this aircraft's CG limits, so the file
                    // may state them. Declared limits are checked for internal coherence
                    // (both unit systems present and agreeing, forward ahead of rearward) and
                    // rejected as a block if they do not hold, rather than half-applied.
                    // Omitted, they fall back to the type's published envelope.
                    const limits = this.validateCgLimits(entry.cg_limits);
                    if (limits === false) return null;

                    const sn = typeof entry.serial_number === 'string' ? entry.serial_number : '';
                    const date = typeof entry.weighing_date === 'string' ? entry.weighing_date : null;
                    return {
                        id: id,
                        name: `${id} - ${type.name}`,
                        meta: sn ? `S/N: ${sn}` : '',
                        limits: limits || type.limits,
                        limitsFromManifest: !!limits,
                        data: {
                            metric: { weight: w.kg, arm: a.mm },
                            imperial: { weight: w.lbs, arm: a.in }
                        },
                        weighingDate: date,
                        note: typeof entry.note === 'string' ? entry.note : null
                    };
                },
                // null  -> not declared, inherit from the type
                // false -> declared but unusable, reject the whole aircraft
                // object-> usable limits
                validateCgLimits(raw) {
                    if (raw === null || raw === undefined) return null;
                    if (typeof raw !== 'object' || Array.isArray(raw)) return false;
                    const f = raw.fwd, a = raw.aft;
                    if (!f || !a || typeof f !== 'object' || typeof a !== 'object') return false;
                    for (const v of [f.mm, f.in, a.mm, a.in]) {
                        if (!Number.isFinite(v) || v <= 0) return false;
                    }
                    if (f.mm >= a.mm || f.in >= a.in) return false;          // forward must sit ahead of rearward
                    // The two unit systems have to describe the same envelope: a typo in one
                    // of them would otherwise pass unnoticed until someone switched units.
                    if (Math.abs(f.mm / 25.4 - f.in) > 0.1) return false;
                    if (Math.abs(a.mm / 25.4 - a.in) > 0.1) return false;
                    return {
                        metric: { fwd: f.mm, aft: a.mm },
                        imperial: { fwd: f.in, aft: a.in }
                    };
                },
                // True when the selected aircraft is flying on its type's published envelope
                // rather than on the one its own manifest states.
                get currentPlaneLimitsFromType() {
                    const p = this.fleet.find(p => p.id === this.selectedPlaneId);
                    if (!p || this.RESERVED_IDS.includes(p.id)) return false;
                    return !p.limitsFromManifest;
                },
                // Split from the fetch so the suite can exercise it without a server
                applyFleetPayload(payload) {
                    this.fleet = this.fleet.filter(p => this.RESERVED_IDS.includes(p.id));
                    this.fleetSkipped = 0;
                    if (!payload || typeof payload !== 'object' || payload.schema !== 1 || !Array.isArray(payload.aircraft)) {
                        this.fleetStatus = 'error';
                        return false;
                    }
                    for (const entry of payload.aircraft) {
                        const plane = this.validateFleetEntry(entry);
                        if (plane) this.fleet.push(plane); else this.fleetSkipped++;
                    }
                    this.fleetStatus = 'ready';
                    return true;
                },
                loadFleet() {
                    this.fleetStatus = 'loading';
                    return fetch(this.FLEET_URL, { cache: 'no-cache' })
                        .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                        .then(payload => this.applyFleetPayload(payload))
                        .catch(() => {
                            // Unreachable, unparseable or malformed: say so instead of
                            // quietly running on the handbook entries alone.
                            this.fleet = this.fleet.filter(p => this.RESERVED_IDS.includes(p.id));
                            this.fleetStatus = 'error';
                            return false;
                        });
                },
                get fleetFailed() { return this.fleetStatus === 'error'; },
                // Empty weight has a shelf life: it moves with repaints, instruments and
                // periodic reweighing. An undated figure cannot be checked against anything.
                get currentPlaneUndated() {
                    const p = this.fleet.find(p => p.id === this.selectedPlaneId);
                    // The handbook entries are samples, not airframes: they need no date
                    if (!p || this.RESERVED_IDS.includes(p.id)) return false;
                    return !p.weighingDate;
                },
                get currentPlaneWeighingDate() {
                    const p = this.fleet.find(p => p.id === this.selectedPlaneId);
                    return (p && p.weighingDate) || '';
                },
                get currentPlaneNote() {
                    const p = this.fleet.find(p => p.id === this.selectedPlaneId);
                    return (p && p.note) || '';
                },

                loadPlaneData() {
                    const plane = this.fleet.find(p => p.id === this.selectedPlaneId);
                    if (plane) {
                        // 1. Load the aircraft weight/arm data
                        const data = this.units === 'metric' ? plane.data.metric : plane.data.imperial;
                        this.aircraft.weight = data.weight;
                        this.aircraft.arm = data.arm;

                        // 2. Load the aircraft-specific limits (kept per aircraft: a future type
                        //    with a different envelope plugs in here)
                        const limits = this.units === 'metric' ? plane.limits.metric : plane.limits.imperial;
                        this.activeLimits.fwd = limits.fwd;
                        this.activeLimits.aft = limits.aft;
                    }
                    this.update();
                },

                // Converts one field, leaving a pending one pending. In JS null * 2.20462
                // is 0, so converting blindly turned "not entered yet" into a real 0 on
                // every units switch: the pilot weight stopped asking for a value and
                // started reading as below the 55 kg minimum, and an untouched tank
                // reading raised the unusable-fuel alert on its own. The UI tells the two
                // states apart with Number.isFinite, so the conversion has to as well.
                toUnit(value, convert, decimals = 2) {
                    if (!Number.isFinite(value)) return value;
                    return parseFloat(convert(value).toFixed(decimals));
                },

                setUnits(newSystem) {
                    if (this.units === newSystem) return;

                    // Conversion constants
                    const KG_TO_LBS = 2.20462;
                    const MM_TO_IN = 1/25.4;
                    const L_TO_GAL = 0.264172;

                    // 1. Convert the LOAD (pilot, copilot, baggage, fuel)
                    // (2 decimals: with 1, toggling units repeatedly accumulates rounding drift)
                    if (newSystem === 'imperial') {
                        // Metric to imperial
                        this.load.pilot = this.toUnit(this.load.pilot, v => v * KG_TO_LBS);
                        this.load.copilot = this.toUnit(this.load.copilot, v => v * KG_TO_LBS);
                        this.load.baggage = this.toUnit(this.load.baggage, v => v * KG_TO_LBS);
                        this.fuel.startAmount = this.toUnit(this.fuel.startAmount, v => v * L_TO_GAL);
                    } else {
                        // Imperial to metric
                        this.load.pilot = this.toUnit(this.load.pilot, v => v / KG_TO_LBS);
                        this.load.copilot = this.toUnit(this.load.copilot, v => v / KG_TO_LBS);
                        this.load.baggage = this.toUnit(this.load.baggage, v => v / KG_TO_LBS);
                        this.fuel.startAmount = this.toUnit(this.fuel.startAmount, v => v / L_TO_GAL);
                    }

                    const plane = this.fleet.find(p => p.id === this.selectedPlaneId);

                    // 2. Convert or load the AIRCRAFT data (empty weight, arm and LIMITS)
                    if (plane && this.selectedPlaneId !== 'custom') {
                        // CASE A: predefined aircraft, load the hard data for the new unit system
                        const newData = newSystem === 'metric' ? plane.data.metric : plane.data.imperial;
                        const newLimits = newSystem === 'metric' ? plane.limits.metric : plane.limits.imperial;

                        // Update empty weight and arm
                        this.aircraft.weight = newData.weight;
                        this.aircraft.arm = newData.arm;

                        // Update the dynamic limits for the new unit system
                        this.activeLimits.fwd = newLimits.fwd;
                        this.activeLimits.aft = newLimits.aft;

                    } else {
                        // CASE B: custom aircraft. The empty weight and arm are the user's
                        // own figures, so they get converted. The LIMITS are not: the entry
                        // publishes both unit systems and reading them keeps the envelope on
                        // the handbook's numbers rather than on a rounded conversion of them.
                        // Converting handed back 373.1 mm after a metric-imperial-metric
                        // round trip, a tenth of a millimetre BEHIND the published rearward
                        // limit. Negligible in size and the wrong direction in principle:
                        // every other aircraft is judged against published figures, and an
                        // exception nobody remembers is how a widened envelope survives.
                        if (newSystem === 'imperial') {
                            // Metric -> imperial
                            this.aircraft.weight = this.toUnit(this.aircraft.weight, v => v * KG_TO_LBS);
                            this.aircraft.arm = this.toUnit(this.aircraft.arm, v => v * MM_TO_IN);
                        } else {
                            // Imperial -> metric
                            this.aircraft.weight = this.toUnit(this.aircraft.weight, v => v / KG_TO_LBS);
                            this.aircraft.arm = this.toUnit(this.aircraft.arm, v => v / MM_TO_IN, 1);
                        }

                        const published = plane && (newSystem === 'metric' ? plane.limits.metric : plane.limits.imperial);
                        if (published) {
                            this.activeLimits.fwd = published.fwd;
                            this.activeLimits.aft = published.aft;
                        } else {
                            // No aircraft picked yet, so no entry publishes an envelope and
                            // the pair on screen is all there is. Nothing is judged in this
                            // state either: dataPending holds the verdict until a registration
                            // and an empty weight are in.
                            const convert = newSystem === 'imperial' ? (v => v * MM_TO_IN) : (v => v / MM_TO_IN);
                            const decimals = newSystem === 'imperial' ? 2 : 1;
                            this.activeLimits.fwd = this.toUnit(this.activeLimits.fwd, convert, decimals);
                            this.activeLimits.aft = this.toUnit(this.activeLimits.aft, convert, decimals);
                        }
                    }

                    // Update state and recalculate. A units switch converts the
                    // representation, it is not a data edit: the age clock stays put.
                    this.units = newSystem;
                    this._suppressTouch = true;
                    this.update();
                    this._suppressTouch = false;
                },

                update() {
                    // 1. Total tank capacity: what a full tank reads (POH 2.8)
                    // Metric: 50 liters. Imperial: 13.2 gallons.
                    const maxFuelTotal = this.currentLimits.maxFuelTotal;

                    // 2. Input validation (clamping)
                    if (this.fuel.startAmount < 0) this.fuel.startAmount = 0;

                    // Nothing above the tank capacity can physically be on board.
                    if (this.fuel.startAmount > maxFuelTotal) {
                        this.fuel.startAmount = maxFuelTotal;
                    }

                    if (this.load.pilot < 0) this.load.pilot = 0;
                    if (this.load.copilot < 0) this.load.copilot = 0;
                    if (this.load.baggage < 0) this.load.baggage = 0;
                    // Without this, a negative time "creates" fuel: negative burn, more
                    // remaining than loaded, and a landing heavier than the takeoff.
                    if (this.fuel.flightTime < 0) this.fuel.flightTime = 0;

                    // ---------------------------------------------------------
                    // FUEL LOGIC
                    // ---------------------------------------------------------

                    // 1. Constants
                    const flow = this.currentFuelFlow;
                    const density = this.units === 'metric' ? this.constants.metric.fuelDensity : this.constants.imperial.fuelDensity;
                    const unusable = this.currentUnusableFuel;

                    // 2. USABLE FUEL (tank reading minus unusable)
                    // Enter 50 (full tank): usable = 48. Enter 1: usable = 0.
                    let usableFuelAmount = Math.max(0, this.fuel.startAmount - unusable);

                    // 3. Endurance math based on USABLE fuel
                    this.fuelResults.burnedAmount = this.fuel.flightTime * flow;

                    // Remaining is measured against usable fuel
                    this.fuelResults.remainingAmount = usableFuelAmount - this.fuelResults.burnedAmount;

                    // Remaining time
                    this.fuelResults.remainingTime = flow > 0 ? (this.fuelResults.remainingAmount / flow) : 0;

                    // Planned distance: still-air distance covered in the PLANNED time.
                    // Not fuel-limited on purpose. It answers "how far does the plan go",
                    // and the endurance below answers "how far does the fuel reach".
                    // Clamping this one to the fuel would make it mean two different
                    // things depending on the fuel state.
                    const currentProfile = this.perfProfiles[this.selectedPerfIndex];
                    this.fuelResults.rangeNM = Math.round(currentProfile.ktas * this.fuel.flightTime);

                    // Endurance: what the usable fuel buys, independent of the planned time.
                    // Empty tank reads 0.0 h / 0 NM, which is what makes the pair honest.
                    this.fuelResults.enduranceHours = flow > 0 ? usableFuelAmount / flow : 0;
                    this.fuelResults.enduranceNM = Math.round(currentProfile.ktas * this.fuelResults.enduranceHours);

                    // 4. WEIGHT: only the USABLE fuel weight is added.
                    // (Unusable fuel weight is already part of the Basic Empty Weight)
                    this.fuelResults.weightStart = usableFuelAmount * density;

                    // Final weight (usable remaining * density)
                    const endFuelUsable = Math.max(0, this.fuelResults.remainingAmount);
                    this.fuelResults.weightEnd = endFuelUsable * density;

                    // ---------------------------------------------------------

                    // W&B points
                    this.results.takeoff = this.calculatePoint(this.fuelResults.weightStart);
                    this.results.landing = this.calculatePoint(this.fuelResults.weightEnd);

                    this.drawChart();

                    // update() is the funnel for every user edit (inputs, plane select,
                    // units), so this is the single save point.
                    this.saveState();
                },

                calculatePoint(fuelWeight) {
                    const arms = this.currentArms, limits = this.currentLimits;
                    let totalWeight = this.aircraft.weight + this.load.pilot + this.load.copilot + this.load.baggage + fuelWeight;
                    let totalMoment = (this.aircraft.weight * this.aircraft.arm) + (this.load.pilot * arms.pilot) + (this.load.copilot * arms.copilot) + (this.load.baggage * arms.baggage) + (fuelWeight * arms.fuel);
                    let cg = totalWeight > 0 ? totalMoment / totalWeight : 0;
                    return { weight: totalWeight, moment: totalMoment, cg: cg, isValid: totalWeight >= limits.minW && totalWeight <= limits.mtom && cg >= limits.fwd && cg <= limits.aft };
                },
                drawChart() {
                    const canvas = document.getElementById('wbChart'); if (!canvas) return;
                    const ctx = canvas.getContext('2d'); const w = canvas.width; const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);
                    let minX, maxX, stepX, minY, maxY, stepY;
                    if (this.units === 'metric') { minX = 220; maxX = 400; stepX = 20; minY = 320; maxY = 600; stepY = 20; }
                    else { minX = 8.5; maxX = 16.0; stepX = 1.0; minY = 700; maxY = 1350; stepY = 100; }
                    const mapX = (val) => (val - minX) / (maxX - minX) * w; const mapY = (val) => h - ((val - minY) / (maxY - minY) * h);
                    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1; ctx.beginPath();
                    for (let x = minX; x <= maxX; x += (stepX/2)) { let px = mapX(x); if (px >= 0 && px <= w) { ctx.moveTo(px, 0); ctx.lineTo(px, h); } }
                    for (let y = minY; y <= maxY; y += (stepY/2)) { let py = mapY(y); if (py >= 0 && py <= h) { ctx.moveTo(0, py); ctx.lineTo(w, py); } }
                    ctx.stroke();
                    ctx.fillStyle = '#9ca3af'; ctx.font = '10px Arial';
                    for (let x = minX; x <= maxX; x += stepX) { ctx.fillText(Math.round(x*10)/10, mapX(x) + 2, h - 5); }
                    for (let y = minY; y <= maxY; y += stepY) { const py = mapY(y); if (py > 26) ctx.fillText(Math.round(y), 5, py - 2); }
                    // Envelope = VALID zone: neutral border + faint green fill.
                    // Red is reserved for out-of-limits points (POH chart convention).
                    const lim = this.currentLimits;
                    const envLeft = mapX(lim.fwd), envRight = mapX(lim.aft), envTop = mapY(lim.mtom), envBottom = mapY(lim.minW);
                    ctx.fillStyle = 'rgba(22, 163, 74, 0.08)';
                    ctx.fillRect(envLeft, envTop, envRight - envLeft, envBottom - envTop);
                    ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
                    ctx.strokeRect(envLeft, envTop, envRight - envLeft, envBottom - envTop);
                    // Axis titles (translated; setLang() redraws the canvas)
                    ctx.fillStyle = '#475569'; ctx.font = 'bold 11px Arial';
                    ctx.fillText(this.t('axis_weight') + ' (' + this.labels.weight + ')', 5, 14);
                    ctx.textAlign = 'right';
                    ctx.fillText('CG (' + this.labels.arm + ')', w - 6, h - 18);
                    ctx.textAlign = 'left';

                    // Empty envelope while an input is pending: a dot plotted from a missing
                    // empty weight, pilot or tank reading lands wherever the implicit zeros
                    // put it, and inside the envelope it reads as a cleared flight.
                    if (this.wbPending) {
                        ctx.fillStyle = '#6b7280'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
                        ctx.fillText(this.t('status_pending'), w / 2, h / 2);
                        ctx.textAlign = 'left';
                        return;
                    }
                    const drawPoint = (cg, weight, isValid, validColor, label) => { const x = mapX(cg); const y = mapY(weight); ctx.fillStyle = isValid ? validColor : '#dc2626'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#000'; ctx.font = 'bold 11px Arial'; ctx.fillText(label, x + 8, y + 3); };
                    const toX = mapX(this.results.takeoff.cg), toY = mapY(this.results.takeoff.weight), lndX = mapX(this.results.landing.cg), lndY = mapY(this.results.landing.weight);
                    ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(toX, toY); ctx.lineTo(lndX, lndY); ctx.stroke();
                    drawPoint(this.results.takeoff.cg, this.results.takeoff.weight, this.results.takeoff.isValid, '#2563eb', 'TO'); drawPoint(this.results.landing.cg, this.results.landing.weight, this.results.landing.isValid, '#16a34a', 'LDG');
                }
            }
        }

                    QUnit.module('Envelope verdict (what the limits do)', function(hooks) {
                        let vm;
                        hooks.beforeEach(function() {
                            vm = wbCalculator();

                        // weight sits at one arm, so the CG IS that arm, with no division to
                        // round. That is what lets the boundary cases below pin down whether
                        // the comparison is >= or >, which no approximate case can do.
                        function pointAt(weight, arm) {
                            vm.aircraft.weight = weight;
                            vm.aircraft.arm = arm;
                            vm.load.pilot = 0; vm.load.copilot = 0; vm.load.baggage = 0;

                        QUnit.test('An aircraft over MTOM is refused', function(assert) {
                            vm.aircraft.weight = 308; vm.aircraft.arm = 254;
                            vm.load.pilot = 100; vm.load.copilot = 100; vm.load.baggage = 10;
                            vm.fuel.startAmount = 50;
                            vm.update();
                            assert.false(vm.hasLoadErrors, 'Every individual load is legal');
                            assert.true(vm.results.takeoff.weight > vm.currentLimits.mtom,

                        QUnit.test('A units round trip stays inside its rounding, and does not creep', function(assert) {
                            // setUnits() converts the stored values instead of just displaying
                            // them, so a round trip cannot be exact: the arm re-rounds to 0.1 mm
                            // and the tank to 0.01 gal. What matters is that the error is bounded
                            // AND settles: 20 round trips must not drift further than one.
                            const worst = { one: {}, twenty: {} };
                            const track = (bucket, key, value) => { bucket[key] = Math.max(bucket[key] || 0, value); };
                            // One instance, reset per point: building a calculator carries the
                            // whole vocabulary with it and this sweep visits a few hundred points.
                            vm.selectedPlaneId = 'custom';
                            const load = (w, a, p, f) => {
                                vm.units = 'metric';
                                vm.aircraft = { weight: w, arm: a };
                                vm.load = { pilot: p, copilot: 0, baggage: 0 };
                                vm.fuel = { startAmount: f, flightTime: 1 };
                                vm.update();
                            };
                            const measure = (bucket, w, a, p, f) => {
                                track(bucket, 'weight', Math.abs(vm.aircraft.weight - w));
                                track(bucket, 'arm', Math.abs(vm.aircraft.arm - a));
                                track(bucket, 'pilot', Math.abs(vm.load.pilot - p));
                                track(bucket, 'fuel', Math.abs(vm.fuel.startAmount - f));
                            };
                            for (let w = 250; w <= 350; w += 10) {
                                for (let a = 240; a <= 280; a += 2) {
                                    for (let p = 55; p <= 110; p += 11) {
                                        for (let f = 0; f <= 50; f += 12.5) {
                                            load(w, a, p, f);
                                            vm.setUnits('imperial'); vm.setUnits('metric');
                                            measure(worst.one, w, a, p, f);
                                        }
                                    }
                                }
                            }
                            // Convergence is a yes/no property, so a handful of points is enough.
                            // Compared point by point on purpose: two global maxima taken over
                            // different sample sets would let this pass without proving anything.
                            let creep = null;
                            for (const [w, a, p, f] of [[250, 240, 55, 0], [308, 254.7, 82.3, 37.4],
                                                       [312, 272, 110, 50], [350, 279.3, 95, 25.5]]) {
                                const drift = () => ({ arm: Math.abs(vm.aircraft.arm - a), fuel: Math.abs(vm.fuel.startAmount - f) });
                                load(w, a, p, f);
                                vm.setUnits('imperial'); vm.setUnits('metric');
                                const after1 = drift();
                                load(w, a, p, f);
                                for (let i = 0; i < 20; i++) { vm.setUnits('imperial'); vm.setUnits('metric'); }
                                const after20 = drift();
                                if (after20.arm > after1.arm + 1e-9 || after20.fuel > after1.fuel + 1e-9) {
                                    creep = creep || { point: [w, a, p, f], after1, after20 };
                                }
                                track(worst.twenty, 'arm', after20.arm);
                                track(worst.twenty, 'fuel', after20.fuel);
                            }
                            assert.ok(worst.one.weight <= 0.01 && worst.one.pilot <= 0.01,
                                `Weights survive the round trip exactly (empty ${worst.one.weight}, pilot ${worst.one.pilot} kg)`);
                            assert.ok(worst.one.arm <= 0.15, `Arm stays inside its 0.1 mm rounding (worst ${worst.one.arm.toFixed(3)} mm)`);
                            assert.ok(worst.one.fuel <= 0.05, `Tank stays inside its rounding (worst ${worst.one.fuel.toFixed(3)} L)`);
                            assert.ok(creep === null, creep === null
                                ? `The error settles: 20 round trips drift no further than 1 (arm ${worst.twenty.arm.toFixed(3)} mm, tank ${worst.twenty.fuel.toFixed(3)} L)`
                                : `Drift kept creeping at ${JSON.stringify(creep)}`);
                        });
                    });

                        // stub opts a plain factory instance in. loadFleet() is stubbed too:
                        // init() now waits for the fleet before restoring, and these tests are
                        // about localStorage, not about the file or the network.
